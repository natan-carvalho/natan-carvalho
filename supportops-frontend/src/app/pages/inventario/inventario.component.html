<section class="inventory-shell">
  <app-page-title
    title="Inventário"
    subtitle="Cadastre e acompanhe o estado das máquinas da operação"
  ></app-page-title>

  <mat-card class="form-card">
    <h3>Cadastrar máquina</h3>

    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Nome da máquina</mat-label>
        <input matInput [(ngModel)]="form().name" name="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Hostname</mat-label>
        <input matInput [(ngModel)]="form().hostname" name="hostname" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Departamento</mat-label>
        <input matInput [(ngModel)]="form().department" name="department" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Situação</mat-label>
        <mat-select [(ngModel)]="form().status" name="status">
          <mat-option value="Online">Online</mat-option>
          <mat-option value="Aletar">Aletar</mat-option>
          <mat-option value="Offline">Offline</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <button mat-flat-button color="primary" type="button" (click)="addMachine()">Adicionar máquina</button>
  </mat-card>

  <mat-card class="table-card">
    <h3>Máquinas cadastradas</h3>

    <table mat-table [dataSource]="machines()" class="inventory-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Máquina</th>
        <td mat-cell *matCellDef="let machine">{{ machine.name }}</td>
      </ng-container>

      <ng-container matColumnDef="hostname">
        <th mat-header-cell *matHeaderCellDef>Hostname</th>
        <td mat-cell *matCellDef="let machine">{{ machine.hostname }}</td>
      </ng-container>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef>Departamento</th>
        <td mat-cell *matCellDef="let machine">{{ machine.department }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Situação</th>
        <td mat-cell *matCellDef="let machine">
          <span class="status-chip" [class]="getStatusClass(machine.status)">{{ machine.status }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="lastUpdate">
        <th mat-header-cell *matHeaderCellDef>Últ. atualização</th>
        <td mat-cell *matCellDef="let machine">{{ machine.lastUpdate }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>
</section>
