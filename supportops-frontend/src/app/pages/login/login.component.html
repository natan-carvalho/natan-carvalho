<div class="login-shell">
  <mat-card class="login-card">
    <div class="login-brand">
      <div class="brand-icon"><mat-icon>support_agent</mat-icon></div>
      <div>
        <h1>SupportOps</h1>
        <p>Gestão operacional para equipes de suporte</p>
      </div>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>
      <input matInput placeholder="seu@email.com" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Senha</mat-label>
      <input matInput type="password" placeholder="••••••••" />
    </mat-form-field>

    <button mat-flat-button color="primary" routerLink="/dashboard">Entrar</button>
  </mat-card>
</div>
